name: PadelMates Monitor

on:
  schedule:
    - cron: '* 11 * * 1'
    - cron: '* 12 * * 1'
    - cron: '* 13 * * 1'
    - cron: '* 14 * * 1'
    - cron: '* 15 * * 1'
    - cron: '* 16 * * 1'
    - cron: '* 17 * * 1'
  workflow_dispatch:

jobs:
  check-sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pytz
      - name: Run single check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PADELMATES_EMAIL: ${{ secrets.PADELMATES_EMAIL }}
          PADELMATES_PASSWORD: ${{ secrets.PADELMATES_PASSWORD }}
          PADELMATES_REFRESH_TOKEN: ${{ secrets.PADELMATES_REFRESH_TOKEN }}
        run: python monitor_once.py
